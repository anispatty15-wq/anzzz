server {
    listen 80;
    listen [::]:80;
    server_name anzzz.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/anzzz.site;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name anzzz.site;

    root /var/www/anzzz.site;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/anzzz.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anzzz.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-SJaWAWqEhSG9Z0qFDSO0HBCHBTOKLaNSUTfQDcaYzb0=' https://cubism.live2d.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.pinimg.com; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /live2d/ {
        proxy_pass https://model.zulma.id/assets/models/ReZero/rem_1/;
        proxy_ssl_server_name on;
        proxy_set_header Host model.zulma.id;
    }

    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|cur|mp4|m4a)$ {
        try_files $uri =404;
        expires 1h;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
